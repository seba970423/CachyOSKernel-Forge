# Desktop capability defaults: keep the normalized upstream state, including
# disabled/absent settings. Only an explicit No authorizes feature removal.
DEFAULT_KEEP_KVM="yes"
DEFAULT_KEEP_INTEL_TDX="yes"
DEFAULT_KEEP_AMD_SEV="yes"
DEFAULT_KEEP_NVME_FABRICS="yes"
DEFAULT_KEEP_NVME_TARGET="yes"

# Tick frequency is independent from tickless mode and optional tuning.
DEFAULT_KERNEL_HZ="upstream"
