# Optional feature defaults

# Standard hardware virtualization
DEFAULT_KEEP_KVM="yes"

# Advanced confidential-VM features
DEFAULT_ENABLE_INTEL_TDX="no"
DEFAULT_ENABLE_AMD_SEV="no"

# Platform / peripheral-related features
DEFAULT_KEEP_THUNDERBOLT="auto"
DEFAULT_KEEP_IWLWIFI="auto"
DEFAULT_KEEP_I915="auto"

# Specialized NVMe functionality
DEFAULT_ENABLE_NVME_FABRICS="no"
DEFAULT_ENABLE_NVME_TARGET="no"
