# Portable desktop kernel profile

PROFILE_NAME="desktop"
PROFILE_VERSION="0.5"

# Build policy
PROCESSOR_OPT="native"
TICKRATE="idle"

# Portable invariants
REQUIRE_ENABLED=(
    X86_NATIVE_CPU
    NO_HZ_IDLE
)

REQUIRE_DISABLED=(
    NO_HZ_FULL
    HZ_PERIODIC
)

# These families retain the selected variant's exact upstream state. Disabled
# or unavailable drivers remain valid; this profile never forces them on.
# Prefix matching also protects newly added drivers within each family.
# NVMe Fabrics/Target and virtualization are validated separately below.
PRESERVE_HARDWARE_PREFIXES=(
    ACPI APM PM SUSPEND HIBERNATION CPU_FREQ CPU_IDLE X86_INTEL_PSTATE
    X86_AMD_PSTATE INTEL_IDLE POWER_SUPPLY HWMON THERMAL BACKLIGHT LCD
    EFI FW_LOADER TCG TPM X86_PLATFORM_DEVICES
    DRM FB FRAMEBUFFER_CONSOLE VGA SND SOUND MEDIA VIDEO DVB
    INPUT HID USB_HID I2C_HID MOUSE KEYBOARD SERIO RMI4 JOYSTICK
    USB TYPEC THUNDERBOLT PCI PCIE HOTPLUG_PCI
    WLAN WIRELESS CFG80211 MAC80211 IWL ATH MT76 RTW B43 BRCM RTL BT
    NET_VENDOR E1000 IGC IGB IXGBE I40E ICE R8169 R8168 USB_NET
    SCSI ATA SATA AHCI PATA BLK_DEV_SD BLK_DEV_SR BLK_DEV_NVME NVME_CORE
    NVME_MULTIPATH NVME_HWMON NVME_VERBOSE_ERRORS MMC MD BLK_DEV_DM
    I2C SPI PINCTRL GPIOLIB GPIO REGULATOR RFKILL LEDS
    THINKPAD IDEAPAD LENOVO ASUS DELL HP ACER MSI SURFACE FUJITSU
    TOSHIBA SAMSUNG SONY LG PANASONIC HUAWEI GIGABYTE ALIENWARE
    INTEL_PMC INTEL_HID INTEL_VBTN AMD_PMC
)
